<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CENTER JUST · Legal Due Diligence Quiz</title>
<style>
:root{--navy:#060E24;--blue:#2454BE;--text:#F4F7FC;--muted:#A9B6D3;--gold:#D6B158;--green:#3FA66B;--red:#DE4040;--serif:Georgia,"Times New Roman",serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{color:var(--text);font-family:var(--sans);background:var(--navy);overflow-x:hidden;line-height:1.5}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 100% 0%,rgba(36,84,190,.45),transparent 55%),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%),var(--navy)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;border-bottom:1px solid rgba(214,177,88,.55)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:42px;height:42px;object-fit:contain;flex:none}
.bname{font-family:var(--serif);font-size:19px;letter-spacing:.08em;white-space:nowrap}
.tag{font-size:11.5px;color:var(--muted);font-style:italic}
.hlabel{font-size:11px;letter-spacing:.18em;color:var(--gold);white-space:nowrap}
.prog{height:3px;background:rgba(214,177,88,.12)}
.prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
main{max-width:760px;margin:0 auto;padding:34px 18px 20px}
.panel{background:rgba(16,28,64,.55);backdrop-filter:blur(6px);border:1px solid rgba(214,177,88,.35);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.35);padding:28px}
.center{text-align:center}
.bigmark{display:block;width:150px;height:150px;object-fit:contain;margin:0 auto 18px;filter:drop-shadow(0 8px 24px rgba(0,0,0,.45))}
.presents{font-size:12px;letter-spacing:.3em;color:var(--gold);margin-bottom:8px}
h1{font-family:var(--serif);font-weight:normal;font-size:34px;line-height:1.2}
.rule{width:60px;height:2px;background:var(--gold);margin:16px auto}
.intro{color:var(--muted);margin-bottom:22px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.card{cursor:pointer;text-align:left;background:rgba(255,255,255,.03);border:1px solid rgba(214,177,88,.3);border-radius:12px;padding:14px 16px;color:var(--text);font:inherit;transition:.15s}
.card:hover{border-color:var(--gold)}
.card.sel{border-color:var(--gold);background:rgba(214,177,88,.12)}
.card b{display:block;font-family:var(--serif);font-weight:normal;font-size:17px}
.card span{font-size:13px;color:var(--muted)}
.chk{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:14px;margin-bottom:20px;cursor:pointer}
.chk input{accent-color:var(--gold);width:16px;height:16px}
.btn{cursor:pointer;background:var(--gold);color:#1a1405;border:none;border-radius:10px;padding:12px 26px;font:600 15px var(--sans)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.btn:disabled{opacity:.4;cursor:default}
.qmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:14px}
.qmeta .ok{color:var(--gold)}
.qtext{font-family:var(--serif);font-size:21px;line-height:1.4;margin-bottom:20px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;background:rgba(255,255,255,.035);border:1px solid rgba(169,182,211,.25);border-radius:12px;padding:12px 14px;margin-bottom:10px;color:var(--text);font:inherit;font-size:15.5px;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt .bd{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font-size:13px;color:var(--gold);font-weight:600}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--green);background:rgba(63,166,107,.16)}
.opt.right .bd{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:rgba(222,64,64,.16)}
.opt.wrong .bd{background:var(--red);border-color:var(--red);color:#fff}
.opt.fade{opacity:.45}
.fb{margin-top:6px;padding:12px 14px;border-radius:10px;font-size:14.5px;border-left:3px solid}
.fb.g{border-color:var(--green);background:rgba(63,166,107,.1)}
.fb.r{border-color:var(--red);background:rgba(222,64,64,.1)}
.fb b{display:block;margin-bottom:2px}
.nav{display:flex;justify-content:flex-end;margin-top:18px}
.score{font-family:var(--serif);font-size:64px;color:var(--gold);line-height:1}
.sub{color:var(--muted);margin:8px 0 16px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:20px}
.chip{border:1px solid rgba(214,177,88,.45);border-radius:999px;padding:5px 12px;font-size:13px}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:26px}
.review{text-align:left}
.review h3{font-family:var(--serif);font-weight:normal;color:var(--gold);font-size:18px;margin-bottom:10px}
.ri{border-top:1px solid rgba(169,182,211,.15);padding:12px 0;font-size:14.5px}
.ri .rq{margin-bottom:4px}
.ri .ya.ok{color:var(--green)}.ri .ya.no{color:var(--red)}
.ri .ca{color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.12em;padding:24px 0 30px}
.hide{display:none!important}
@media (max-width:560px){.tag{display:none}header{padding:12px 14px}.bname{font-size:16px}.hlabel{font-size:10px;letter-spacing:.12em}.panel{padding:20px 16px}h1{font-size:27px}.qtext{font-size:18.5px}.score{font-size:52px}main{padding-top:22px}}
</style>
</head>

    <button class="btn" id="go">Start</button>
  </section>
  <section id="quiz" class="panel hide">
    <div class="qmeta"><span id="qnum"></span><span class="ok" id="qok"></span></div>
    <div class="qtext" id="qtext"></div>
    <div id="opts"></div>
    <div id="fb"></div>
    <div class="nav"><button class="btn hide" id="next">Next</button></div>
  </section>
  <section id="result" class="panel center hide">
    <div class="score" id="pct"></div>
    <div class="sub" id="raw"></div>
    <div class="chips" id="chips"></div>
    <div class="actions">
      <button class="btn" id="rw">Retry wrong answers</button>
      <button class="btn ghost" id="ra">Retry all</button>
      <button class="btn ghost" id="ch">Choose another exam</button>
    </div>
    <div class="review"><h3>Review</h3><div id="rev"></div></div>
  </section>
</main>
<footer>CENTER JUST · The center you can trust</footer>
<script>
const DATA={"title": "Legal Due Diligence", "exams": [{"id": "tf", "name": "True or False", "label": "TRUE / FALSE", "questions": [{"q": "Legal due diligence is an investigation into a business carried out by reviewing documents and interviewing employees.", "o": ["True", "False"], "a": 0}, {"q": "Due diligence is most often performed in preparation for a merger, acquisition, licensing, or other transaction.", "o": ["True", "False"], "a": 0}, {"q": "Legal due diligence can only be performed by one company on another company; it can never be an investigation into your own company.", "o": ["True", "False"], "a": 1}, {"q": "Drafting the merger or acquisition agreement is simple, so it does not need an experienced lawyer.", "o": ["True", "False"], "a": 1}, {"q": "The investigation (gathering of facts) is the most time-consuming stage of the legal due diligence process.", "o": ["True", "False"], "a": 0}, {"q": "Legal due diligence investigations are less comprehensive for a merger or acquisition than for other transactions.", "o": ["True", "False"], "a": 1}, {"q": "A verbal conversation is a good way to present the findings for small deals or for a buyer who is concerned about cost.", "o": ["True", "False"], "a": 0}, {"q": "The findings of a legal due diligence investigation are mainly important to the seller and the seller's counsel.", "o": ["True", "False"], "a": 1}, {"q": "An escrow account is a third-party account where money is held until specific conditions are met.", "o": ["True", "False"], "a": 0}, {"q": "When reviewing finance documents, guarantees are an example of contingent obligations.", "o": ["True", "False"], "a": 0}, {"q": "The time required for a legal due diligence investigation is determined by the seller.", "o": ["True", "False"], "a": 1}, {"q": "When a company skips legal due diligence, any problems with the transaction always appear immediately after it is completed.", "o": ["True", "False"], "a": 1}, {"q": "If the investigation is done by in-house lawyers, it is worth getting a second opinion from unbiased lawyers.", "o": ["True", "False"], "a": 0}, {"q": "Representations and warranties liability insurance protects a business from wrongful acts such as misstatements, misleading information, and errors.", "o": ["True", "False"], "a": 0}, {"q": "An IP map must be kept internal and cannot be presented to anyone else who is interested in the IP.", "o": ["True", "False"], "a": 1}]}, {"id": "mcq", "name": "Multiple Choice", "label": "MCQ", "questions": [{"q": "Which of the following is NOT one of the sub-categories of legal due diligence?", "o": ["Intellectual property due diligence", "Business due diligence", "Criminal due diligence", "Accounting due diligence"], "a": 2}, {"q": "What are the three stages of a legal due diligence investigation, in order?", "o": ["Planning, negotiation, closing", "Preparation, investigation, results", "Review, interview, report", "Preparation, drafting, signing"], "a": 1}, {"q": "What is the purpose of the preparation stage?", "o": ["To collect facts and documents", "To present a results summary", "To set goals and priorities", "To sign the purchase agreement"], "a": 2}, {"q": "What are the two main areas of focus in a due diligence investigation?", "o": ["Current status and consequences of the potential agreement", "Purchase price and profits", "Employees and customers", "Taxes and licenses"], "a": 0}, {"q": "Which of the following is an organizational document?", "o": ["Supply contract", "Loan agreement", "Promissory note", "Certificate of incorporation"], "a": 3}, {"q": "Which of the following is reviewed in the contracts part of the investigation?", "o": ["Company by-laws", "Licenses", "Hedging agreements", "Stockholder agreement"], "a": 1}, {"q": "Hedging agreements are examined as part of which group of documents?", "o": ["Finance documents", "Organizational documents", "Contracts", "Litigation"], "a": 0}, {"q": "In the litigation review, what does \"litigation trends\" look at?", "o": ["How many claims are pending", "Which claims were paid in the past", "Who the parties to the contract are", "The types of litigation the company has been involved in and the average damage costs"], "a": 3}, {"q": "When reviewing merger and acquisition agreements, which \"unusual provision\" should the lawyer look for?", "o": ["Dividend policy", "Non-compete obligations and agreements", "Stock records", "Building code requirements"], "a": 1}, {"q": "When looking at ownership in the organizational documents, what is the lawyer trying to establish?", "o": ["Who owns the company's equity", "The contract's termination policy", "Whether there is outstanding debt", "Whether there are liens on the business"], "a": 0}, {"q": "What is a due diligence affidavit used for?", "o": ["To transfer ownership of shares", "To value the target company", "To show a court that all legal obligations to notify the person have been met", "To insure the business against errors"], "a": 2}, {"q": "How long can a legal due diligence investigation take?", "o": ["Exactly one week", "At least two years", "One day at most", "From a few days to several months"], "a": 3}, {"q": "Why do lawyers use a due diligence checklist?", "o": ["To create organization, keep the investigation focused on its primary goals, and improve efficiency", "To replace interviews with employees", "To fix the purchase price", "To avoid giving a legal opinion"], "a": 0}, {"q": "The checklist asks for meeting minutes from stockholder, board, and committee meetings covering how many past years?", "o": ["One year", "Three years", "Five years", "Ten years"], "a": 1}, {"q": "In a property transaction, which of the following must the legal due diligence assess?", "o": ["Registration rights agreements", "The company's dividend policy", "Environmental liabilities", "Stock purchase agreements"], "a": 2}]}]};
const L="abcdefghij";
let sel="all",list=[],i=0,ans=[],lastSet=[];
const $=id=>document.getElementById(id);
function examsFor(s){return s==="all"?DATA.exams:DATA.exams.filter(e=>e.id===s)}
function build(){
  const c=$("cards");let total=0;
  DATA.exams.forEach(e=>{total+=e.questions.length;c.appendChild(card(e.id,e.name,e.questions.length))});
  c.appendChild(card("all","All sections",total));
  mark();
}
function card(id,name,n){const b=document.createElement("button");b.className="card";b.dataset.id=id;b.innerHTML=`<b>${name}</b><span>${n} questions</span>`;b.onclick=()=>{sel=id;mark()};return b}
function mark(){document.querySelectorAll(".card").forEach(c=>c.classList.toggle("sel",c.dataset.id===sel))}
function show(id){["start","quiz","result"].forEach(s=>$(s).classList.toggle("hide",s!==id));window.scrollTo(0,0)}
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function begin(set){
  lastSet=set.slice();list=$("shuf").checked?shuffle(set.slice()):set.slice();i=0;ans=[];show("quiz");render();
}
function allQs(){const out=[];examsFor(sel).forEach(e=>e.questions.forEach((q,n)=>out.push({...q,ex:e,n:n+1})));return out}
function render(){
  const q=list[i];const ok=ans.filter(a=>a.ok).length;
  $("hlabel").textContent=`${q.ex.label} · Q${q.n}`;
  $("bar").style.width=(i/list.length*100)+"%";
  $("qnum").textContent=`Q${i+1} of ${list.length}`;
  $("qok").textContent=`${ok} / ${ans.length} correct`;
  $("qtext").textContent=q.q;
  const o=$("opts");o.innerHTML="";
  q.o.forEach((t,k)=>{const b=document.createElement("button");b.className="opt";b.innerHTML=`<span class="bd">${L[k].toUpperCase()}</span><span></span>`;b.lastChild.textContent=t;b.onclick=()=>pick(k);o.appendChild(b)});
  $("fb").innerHTML="";$("next").classList.add("hide");
}
function pick(k){
  if(ans.length>i)return;
  const q=list[i],ok=k===q.a;ans.push({q,pick:k,ok});
  [...$("opts").children].forEach((b,n)=>{b.disabled=true;if(n===q.a)b.classList.add("right");else if(n===k)b.classList.add("wrong");else b.classList.add("fade")});
  $("fb").innerHTML=`<div class="fb ${ok?"g":"r"}"><b>${ok?"Correct":"Not quite"}</b>Correct answer: (${L[q.a]}) <span></span></div>`;
  $("fb").querySelector("span").textContent=q.o[q.a];
  $("qok").textContent=`${ans.filter(a=>a.ok).length} / ${ans.length} correct`;
  $("bar").style.width=((i+1)/list.length*100)+"%";
  const n=$("next");n.textContent=i===list.length-1?"See result":"Next";n.classList.remove("hide");n.focus();
}
function next(){if(ans.length<=i)return;i++;if(i<list.length)render();else results()}
function results(){
  const ok=ans.filter(a=>a.ok).length;
  $("pct").textContent=Math.round(ok/ans.length*100)+"%";
  $("raw").textContent=`${ok} of ${ans.length} correct`;
  $("hlabel").textContent="RESULTS";
  const ch=$("chips");ch.innerHTML="";
  DATA.exams.forEach(e=>{const a=ans.filter(x=>x.q.ex.id===e.id);if(a.length){const s=document.createElement("span");s.className="chip";s.textContent=`${e.name}: ${a.filter(x=>x.ok).length} / ${a.length}`;ch.appendChild(s)}});
  const r=$("rev");r.innerHTML="";
  ans.forEach((a,n)=>{const d=document.createElement("div");d.className="ri";
    d.innerHTML=`<div class="rq"></div><div class="ya ${a.ok?"ok":"no"}"></div>${a.ok?"":'<div class="ca"></div>'}`;
    d.querySelector(".rq").textContent=`${a.q.ex.label} · Q${a.q.n}. ${a.q.q}`;
    d.querySelector(".ya").textContent=`Your answer: (${L[a.pick]}) ${a.q.o[a.pick]} ${a.ok?"✓":"✗"}`;
    if(!a.ok)d.querySelector(".ca").textContent=`Correct answer: (${L[a.q.a]}) ${a.q.o[a.q.a]}`;
    r.appendChild(d)});
  $("rw").disabled=ok===ans.length;
  show("result");
}
$("go").onclick=()=>begin(allQs());
$("next").onclick=next;
$("rw").onclick=()=>begin(ans.filter(a=>!a.ok).map(a=>a.q));
$("ra").onclick=()=>begin(lastSet);
$("ch").onclick=()=>{$("hlabel").textContent="QUIZ";$("bar").style.width="0";show("start")};
document.addEventListener("keydown",e=>{
  if($("quiz").classList.contains("hide"))return;
  const k=e.key.toLowerCase(),idx=L.indexOf(k);
  if(idx>=0&&idx<list[i].o.length&&k.length===1)pick(idx);
  else if(e.key==="Enter"&&ans.length>i){e.preventDefault();next()}
});
build();
</script>
</body>
</html>
