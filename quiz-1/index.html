<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Legal Training Quiz 1 | Center JUST</title>
<style>
:root{--navy:#0b1a3a;--gold:#d4a832;--parch:#fbf3dc;--blue:#1e5bd8;--red:#e03131;--green:#1f9d55}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Georgia,'Times New Roman',serif;color:#1c2540;
background:radial-gradient(circle at 15% 10%,#2b3a8f55,transparent 40%),radial-gradient(circle at 85% 90%,#c2185b44,transparent 40%),radial-gradient(circle at 80% 15%,#00a8a844,transparent 35%),var(--navy);
display:flex;justify-content:center;padding:16px}
.bar{position:fixed;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#e03131,#f59f00,#fcc419,#37b24d,#1c7ed6,#7048e8,#e03131)}
.wrap{width:100%;max-width:720px;padding-top:10px}
.logo{display:block;width:130px;height:130px;margin:0 auto;border-radius:50%;box-shadow:0 0 0 4px var(--gold),0 0 30px #d4a83277;animation:float 3s ease-in-out infinite}
.brand{text-align:center;color:var(--gold);font-weight:bold;letter-spacing:3px;font-size:22px;margin:8px 0 14px;text-transform:uppercase}
@keyframes float{50%{transform:translateY(-6px)}}
.card{background:var(--parch);border:3px solid var(--gold);border-radius:20px;padding:24px;box-shadow:0 12px 40px #0008;animation:pop .4s ease}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(10px)}}
h1{margin:0 0 6px;text-align:center;font-size:clamp(30px,8vw,46px);background:linear-gradient(90deg,#e03131,#f08c00,#2f9e44,#1c7ed6,#7048e8);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;font-size:18px;margin:0 0 18px;color:#44507a}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}
.chip{padding:8px 16px;border-radius:30px;color:#fff;font-weight:bold;font-size:15px}
.c1{background:#7048e8}.c2{background:#e8590c}.c3{background:#0c8599}
button{font-family:inherit;cursor:pointer;border:0}
.big{display:block;margin:0 auto;padding:16px 38px;font-size:20px;font-weight:bold;color:#fff;border-radius:40px;background:linear-gradient(90deg,#e8590c,#d6336c,#7048e8);box-shadow:0 6px 0 #4a2a9a;transition:.15s}
.big:hover{transform:translateY(-2px)}.big:active{transform:translateY(4px);box-shadow:0 2px 0 #4a2a9a}
.top{display:flex;justify-content:space-between;font-weight:bold;font-size:15px;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.score{background:var(--blue);color:#fff;padding:4px 12px;border-radius:20px}
.prog{height:12px;background:#e5d9ae;border-radius:10px;overflow:hidden;margin-bottom:18px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e03131,#f59f00,#37b24d,#1c7ed6,#7048e8);transition:width .4s}
.tag{display:inline-block;font-size:12px;font-weight:bold;color:#fff;padding:3px 10px;border-radius:20px;margin-bottom:10px;letter-spacing:1px}
.q{font-size:clamp(19px,4.6vw,24px);font-weight:bold;line-height:1.4;margin:0 0 18px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:10px 0;padding:14px;min-height:56px;font-size:17px;font-family:inherit;color:#1c2540;background:#fff;border:2.5px solid #e0cf93;border-radius:14px;transition:.15s}
.opt:hover:not(:disabled){transform:translateX(5px);border-color:var(--gold);box-shadow:0 4px 12px #d4a83255}
.opt b{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:16px}
.opt:nth-child(1) b{background:#e03131}.opt:nth-child(2) b{background:#f08c00}.opt:nth-child(3) b{background:#2f9e44}.opt:nth-child(4) b{background:#7048e8}
.opt.tf{justify-content:center;font-size:20px;font-weight:bold}
.opt.ok{background:var(--blue);border-color:#0d3a9e;color:#fff;animation:bump .4s}
.opt.bad{background:var(--red);border-color:#9c1c1c;color:#fff;animation:shake .4s}
.opt.ok b,.opt.bad b{background:#fff3;color:#fff}
.opt:disabled{cursor:default}.opt:disabled:not(.ok):not(.bad){opacity:.55}
@keyframes bump{50%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{margin-top:14px;padding:14px;border-radius:14px;font-size:16px;line-height:1.5;animation:pop .3s}
.fb.ok{background:#dbe7ff;border-left:6px solid var(--blue)}.fb.bad{background:#ffe0e0;border-left:6px solid var(--red)}
.fb strong{display:block;font-size:19px;margin-bottom:4px}
.next{margin-top:16px}
.hide{display:none}
.final{text-align:center}
.pct{font-size:64px;font-weight:bold;margin:6px 0;color:var(--blue)}
.msg{font-size:20px;margin:6px 0 20px}
.p{position:fixed;top:-30px;font-size:26px;pointer-events:none;z-index:9;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
</style></head><body>

{t:"tf",q:"Practical Legal Training helps bridge the gap between legal theory and its practical application.",a:true,e:"PLT is a stage that connects what students learn in theory with real practice."},
{t:"tf",q:"Legal memos are formal documents filed with the court at the beginning of a lawsuit.",a:false,e:"Legal memos are internal documents; it is pleadings that are filed with the court."},
{t:"tf",q:"A legal opinion letter may be requested by a client or by a third party.",a:true,e:"Either a client or a third party seeking expert guidance can request the letter."},
{t:"tf",q:"A good opinion should start with a concise summary of the pertinent facts.",a:true,e:"This is good writing practice and removes potential misunderstandings about the basis of the opinion."},
{t:"tf",q:"A statute or case should be quoted in an opinion whenever possible, even if it is not directly relevant.",a:false,e:"Statutes and cases should be quoted only when they have direct relevance."},
{t:"tf",q:"An opinion should present the client's case with as much optimism as possible.",a:false,e:"The case should be presented reasonably, avoiding unwarranted optimism."},
{t:"tf",q:"A legal opinion must maintain objectivity.",a:true,e:"Objectivity is a core part of a professional approach."},
{t:"tf",q:"A good legal opinion letter should be as long as possible.",a:false,e:"It should be no longer than reasonably necessary and contain no irrelevancies."},
{t:"tf",q:"An opinion should stay grounded in reality rather than adopting an academic tone.",a:true,e:"A professional opinion is practical and realistic, not academic."},
{t:"tf",q:"The recipient of the opinion, whether the solicitor or the client, should be clearly identified in the letter.",a:true,e:"Clear context starts with identifying who the opinion is addressed to."},
{t:"tf",q:"Contracts must be precise to ensure enforceability and reflect the parties' intentions accurately.",a:true,e:"Precision is what makes a contract enforceable and faithful to the parties' intentions."},
{t:"tf",q:"Advice areas in an opinion should be addressed in a logical sequence.",a:true,e:"A clear structure means each area of advice is handled individually and in logical order."},
{t:"mc",q:"Which document is an internal one, written in an objective tone to inform colleagues about the strengths and weaknesses of a case?",o:["Pleading","Legal memo","Contract","Legal correspondence"],a:1,e:"Legal memos are internal documents analysing legal issues and giving recommendations."},
{t:"mc",q:"Complaints, answers, and counterclaims are examples of:",o:["Contracts","Legal opinions","Pleadings","Legal memos"],a:2,e:"Pleadings are formal court documents that set out each party's claims and defenses."},
{t:"mc",q:"What is the primary objective of a legal opinion letter?",o:["To start a lawsuit","To give the recipient insights for well-informed decisions or guidance on the best legal course","To replace a contract","To list the lawyer's qualifications"],a:1,e:"The letter equips the recipient to decide or choose the most suitable legal course of action."},
{t:"mc",q:"What is the first stage in writing a legal opinion?",o:["Signing the letter","Quoting statutes","Receiving instructions from the client","Filing a pleading"],a:2,e:"The foundation of the letter is thorough consultation with the client."},
{t:"mc",q:"Which of the following is NOT something the lawyer establishes when interviewing the client?",o:["Client objectives","Background of the case","Relevant documentation","The lawyer's preferred fee"],a:3,e:"The interview covers objectives, background, relevant documents, and instructions and questions."},
{t:"mc",q:"Legal correspondence includes:",o:["Letters and emails to clients, opposing counsel, and other parties","Only court judgments","Only internal memos","Only contracts"],a:0,e:"Such communications must be clear, professional, and appropriately detailed."},
{t:"mc",q:"If the available information is insufficient to construct the opinion, the lawyer should determine whether:",o:["The client should be dropped","A consultation with the client or extensive legal research is necessary","The letter can be guessed","The opinion should be shortened"],a:1,e:"Further data and insights may require a meeting with the client or legal research."},
{t:"mc",q:"If a case falls outside your areas of practice, you should:",o:["Accept it without checking","Ignore the client's goals","Make sure the case aligns with your expertise","Skip the research"],a:2,e:"Evaluating complexity and expertise is part of deciding the appropriate course of action."},
{t:"mc",q:"Which of these must a legal opinion contain?",o:["A summary of facts","The lawyer's personal biography","The client's bank statements","A court timetable"],a:0,e:"Required contents include title, introduction, summary of facts, legal issues, applicable law, analysis, and the specific opinion."},
{t:"mc",q:"Which item comes first in the contents of a legal opinion letter?",o:["Analysis of facts and law","Summary of facts","The title/heading showing the subject matter","The specific advice"],a:2,e:"The title or heading shows the subject matter of the opinion."},
{t:"mc",q:"Cases mentioned in an opinion should be referred to:",o:["Without details","With full reference","Only by nickname","Only in footnotes"],a:1,e:"Cases should be cited with full reference, and legal propositions supported by clear authority."},
{t:"mc",q:"Practitioner books may be suggested in an opinion:",o:["Never","For further reference, if needed","Only to the court","Instead of analysis"],a:1,e:"Suggesting practitioner books for further reference is appropriate when needed."},
{t:"mc",q:"In the sample opinion letter, which section lists the relevant statutes reviewed?",o:["Introduction","Background","Laws Considered","The Opinion"],a:2,e:"The Laws Considered section lists the statutes the lawyer found relevant."},
{t:"mc",q:"In the sample letter, which section states what the lawyer has taken as given for the purpose of the opinion?",o:["Assumption and Limitation","Introduction","Laws Considered","Kindest regards"],a:0,e:"Assumptions and limitations are set out before the final opinion."},
{t:"mc",q:"Which aspects should clear, sound advice encompass?",o:["Cause of action, liability, damages, and recommended legal actions","Only the lawyer's fees","Only dates","Only the client's address"],a:0,e:"These are the aspects named in the checklist for sound legal advice."},
{t:"mc",q:"Which statement about contracts is correct?",o:["They are internal memos","They outline the terms and conditions of agreements between parties","They are filed to start a lawsuit","They give an attorney's opinion"],a:1,e:"Legal professionals draft contracts to set out the terms and conditions agreed between parties."},
{t:"mc",q:"Legal opinions, often requested by clients, help them understand:",o:["The lawyer's fees","The legal implications of certain actions or transactions","The court's holidays","The opposing party's finances"],a:1,e:"Legal opinions give an attorney's view on specific legal matters and their implications."},
{t:"mc",q:"A professional opinion should arrive at clear conclusions, even if it means:",o:["Hiding uncertainties","Acknowledging options or uncertainties","Avoiding all advice","Ignoring the client's goals"],a:1,e:"Clarity is required even when options or uncertainties must be acknowledged."}
